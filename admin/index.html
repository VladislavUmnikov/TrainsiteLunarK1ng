<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070b12">
  <title>TrainSite Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="admin-body">
  <div class="ambient" aria-hidden="true">
    <div class="ambient__orb ambient__orb--1"></div>
    <div class="ambient__orb ambient__orb--2"></div>
    <div class="ambient__grid"></div>
  </div>

  <div class="admin-shell">
    <header class="admin-header">
      <a class="brand" href="../index.html" aria-label="Открыть публичный TrainSite">
        <span class="brand__mark" aria-hidden="true">▰</span>
        <span><strong>TrainSite Admin</strong><small>Панель управления</small></span>
      </a>
      <div class="header-actions">
        <span class="live-indicator"><i></i> LOCAL CMS</span>
        <time class="header-clock" id="admin-clock">--:--</time>
        <button class="avatar" type="button" aria-label="Профиль администратора">А</button>
      </div>
    </header>

    <aside class="admin-sidebar" aria-label="Основная навигация">
      <nav class="admin-nav" id="admin-nav">
        <button class="nav-item is-active" type="button" data-view="dashboard"><span>⌂</span> Главная</button>
        <p class="nav-group">Расписание</p>
        <button class="nav-item" type="button" data-view="trips"><span>◷</span> Поездки</button>
        <button class="nav-item" type="button" data-view="timetable"><span>▤</span> Табло</button>
        <button class="nav-item" type="button" data-view="stations"><span>⌖</span> Станции</button>
        <p class="nav-group">Система</p>
        <button class="nav-item" type="button" data-view="settings"><span>⚙</span> Настройки</button>
      </nav>
      <a class="sidebar-link" href="../index.html">↗ Открыть сайт</a>
    </aside>

    <main class="admin-main" id="admin-main" tabindex="-1" aria-live="polite"></main>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
